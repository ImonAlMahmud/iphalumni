<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অফলাইন — আইপিএইচ অ্যালামনাই অ্যাসোসিয়েশন</title>
  <meta name="theme-color" content="#800020">
  <link rel="icon" type="image/png" href="images/LOGO.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(800px 400px at 50% 0%, rgba(128,0,32,0.06), transparent 70%), #FAFAFA;
      color: #101820;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .offline-card {
      background: #FFFFFF;
      border: 1px solid rgba(16,24,32,0.08);
      border-radius: 28px;
      padding: 42px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 45px -15px rgba(16,24,32,0.08);
      animation: popIn 0.4s ease-out;
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(15px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .logo-badge {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: #FDF2F4;
      border: 1px solid rgba(128,0,32,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      box-shadow: 0 8px 20px -6px rgba(128,0,32,0.15);
    }
    .logo-badge img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(220, 38, 38, 0.08);
      color: #dc2626;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #dc2626;
      animation: blink 1.2s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #101820;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .retry-btn {
      display: inline-block;
      width: 100%;
      padding: 13px 20px;
      border-radius: 14px;
      background: linear-gradient(135deg, #A22638, #800020);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(128,0,32,0.3);
      transition: all 0.2s ease;
    }
    .retry-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .footer-note {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="logo-badge">
      <img src="images/LOGO.png" alt="IPH Alumni Logo">
    </div>
    <div class="status-pill">
      <span class="status-dot"></span> ইন্টারনেট সংযোগ বিচ্ছিন্ন
    </div>
    <h1>আপনি বর্তমানে অফলাইনে আছেন</h1>
    <p>আইপিএইচ অ্যালামনাই পোর্টালে যুক্ত হতে অনুগ্রহ করে আপনার Wi-Fi বা মোবাইল ডাটা কানেকশনটি চেক করুন। সংযোগ ফিরে এলে পেজটি রিলোড দিন।</p>
    <button class="retry-btn" onclick="window.location.reload()">
      🔄 পুনরায় চেষ্টা করুন (Retry)
    </button>
    <div class="footer-note">
      আইপিএইচ অ্যালামনাই অ্যাসোসিয়েশন · PWA অফলাইন মোড
    </div>
  </div>
</body>
</html>
